<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="splitsnap">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
    />
    <title>splitsnap</title>
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <!--
      Blank-page safety net. A deploy replaces the hashed /assets/* files, so a tab
      (or a restored page) still pointing at the old ones loads nothing and stays
      blank. This runs before the app's own code: if an app file fails to load, or
      nothing has rendered after 10 s, reload once. The sessionStorage marker makes
      it at most one reload, so a real outage can't loop; it clears after a good render.
    -->
    <script>
      (function () {
        var KEY = 'splitsnap:boot-reload'
        function reloadOnce() {
          try {
            if (sessionStorage.getItem(KEY)) return
            sessionStorage.setItem(KEY, '1')
          } catch (e) {
            return // no storage: can't guard against a loop, so don't reload at all
          }
          location.reload()
        }
        function rendered() {
          var root = document.getElementById('root')
          return !!(root && root.firstElementChild)
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            var url = t && (t.src || t.href)
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/assets\//.test(url || '')) reloadOnce()
          },
          true,
        )
        setTimeout(function () {
          if (!rendered()) reloadOnce()
        }, 10000)
        window.addEventListener('load', function () {
          setTimeout(function () {
            if (rendered()) {
              try {
                sessionStorage.removeItem(KEY)
              } catch (e) {}
            }
          }, 3000)
        })
      })()
    </script>
    <style>
      html { background-color: #0a0a0a; color-scheme: dark; }
      html[data-theme="paper"] { background-color: #ffffff; color-scheme: light; }
      html[data-theme="splitsnap"] { background-color: #f5f5f2; color-scheme: light; }
      /* Add one line per theme you create, mirroring its --color-background. */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
